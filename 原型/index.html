<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventHub - Community Event Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div id="background-container" class="background-container">
        <div id="video-background" class="video-background hidden">
            <video id="bg-video" autoplay muted loop playsinline>
                <source src="Mock-background/videos/8cd6ab41d3814faac0f96ec1e2bd4fbd_raw.mp4" type="video/mp4">
            </video>
        </div>
        <div id="image-background" class="image-background"></div>
        <div id="css-animation-background" class="css-animation-background">
            <div class="rain-background"></div>
            <div class="thunder-flash"></div>
        </div>
    </div>
    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-circle"></div>
                <span class="sidebar-logo-text">EventHub</span>
            </div>
            <nav class="sidebar-nav">
                <a class="sidebar-nav-item active" href="#home" onclick="showPage('home'); return false;">
                    <i class="fas fa-home"></i> Home
                </a>
                <a class="sidebar-nav-item" href="#communities" onclick="showPage('communities'); return false;">
                    <i class="fas fa-users"></i> Communities
                </a>
                <a class="sidebar-nav-item" href="#events" onclick="showPage('events'); return false;">
                    <i class="fas fa-calendar"></i> Events
                </a>
                <a class="sidebar-nav-item" href="#registrations" onclick="showPage('registrations'); return false;">
                    <i class="fas fa-file-alt"></i> Registrations
                </a>
                <a class="sidebar-nav-item" href="#users" onclick="showPage('users'); return false;">
                    <i class="fas fa-users"></i> Users
                </a>
                <a class="sidebar-nav-item" href="#categories" onclick="showPage('categories'); return false;">
                    <i class="fas fa-tags"></i> Categories
                </a>
                <a class="sidebar-nav-item" href="#dashboard" onclick="showPage('dashboard'); return false;">
                    <i class="fas fa-chart-line"></i> Dashboard
                </a>
                <a class="sidebar-nav-item" href="#applications" onclick="showPage('applications'); return false;">
                    <i class="fas fa-file-clipboard"></i> Applications
                </a>
                <a class="sidebar-nav-item" href="#community-approvals" onclick="showPage('community-approvals'); return false;">
                    <i class="fas fa-check-circle"></i> Approvals
                </a>
                <a class="sidebar-nav-item" href="#profile" onclick="showPage('profile'); return false;">
                    <i class="fas fa-user-circle"></i> Profile
                </a>
            </nav>
        </aside>

        <div class="main-content">
            <header class="top-navbar">
                <div class="search-area">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" placeholder="Search events..." id="searchInput">
                </div>
                <div class="user-area">
                    <div class="user-avatar"></div>
                    <i class="fas fa-chevron-down user-icon"></i>
                </div>
            </header>

            <div class="content-area">
            <div class="card-templates" style="display: none;">
                <template id="stat-card-template">
                    <div class="stat-card p-4">
                        <div class="stat-actions">
                            <button class="list-action-btn" onclick="handleStatCardAction('{{id}}', 'more')">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                        </div>
                        <div class="stat-icon text-primary mb-2">
                            <i class="fas {{icon}}"></i>
                        </div>
                        <div class="stat-value">{{value}}</div>
                        <div class="stat-label">{{label}}</div>
                    </div>
                </template>
                <template id="event-card-template">
                    <div class="event-card" onclick="viewEvent('{{id}}')">
                        <div class="event-banner">
                            <div class="event-badge {{statusClass}}">{{status}}</div>
                        </div>
                        <div class="event-content">
                            <h3 class="event-title">{{title}}</h3>
                            <p class="event-desc">{{description}}</p>
                            <div class="event-meta">
                                <span class="event-meta-item"><i class="fas fa-calendar"></i>{{date}}</span>
                                <span class="event-meta-item"><i class="fas fa-map-marker-alt"></i>{{location}}</span>
                                <span class="event-meta-item"><i class="fas fa-users"></i>{{participants}} participants</span>
                            </div>
                        </div>
                        <div class="event-actions">
                            <button class="event-action-btn primary" onclick="event.stopPropagation(); handleEventAction('{{id}}', 'register')">
                                <i class="fas fa-clipboard-list"></i> Register
                            </button>
                            <button class="event-action-btn secondary" onclick="event.stopPropagation(); handleEventAction('{{id}}', 'share')">
                                <i class="fas fa-share-alt"></i> Share
                            </button>
                        </div>
                    </div>
                </template>
                <template id="community-card-template">
                    <div class="community-card" onclick="viewCommunity('{{id}}')">
                        <div class="community-banner"></div>
                        <div class="community-logo">{{logoEmoji}}</div>
                        <div class="community-content">
                            <h3 class="community-name">{{name}}</h3>
                            <p class="community-desc">{{description}}</p>
                            <div class="community-meta">
                                <span class="community-member-count"><i class="fas fa-users"></i>{{memberCount}} members</span>
                                <span class="community-member-count"><i class="fas fa-calendar"></i>{{eventCount}} events</span>
                            </div>
                        </div>
                        <div class="community-actions">
                            <button class="community-action-btn join" onclick="event.stopPropagation(); handleCommunityAction('{{id}}', 'join')">
                                <i class="fas fa-user-plus"></i> Join
                            </button>
                            <button class="community-action-btn view" onclick="event.stopPropagation(); handleCommunityAction('{{id}}', 'view')">
                                <i class="fas fa-eye"></i> View
                            </button>
                        </div>
                    </div>
                </template>
                <template id="list-card-template">
                    <div class="list-card">
                        <div class="list-card-icon {{iconClass}}">
                            <i class="fas {{icon}}"></i>
                        </div>
                        <div class="list-card-content">
                            <h4 class="list-card-title">{{title}}</h4>
                            <p class="list-card-desc">{{description}}</p>
                            <span class="list-card-meta">{{meta}}</span>
                        </div>
                        <div class="list-card-actions">
                            <button class="list-action-btn" onclick="handleListAction('{{id}}', 'edit')"><i class="fas fa-edit"></i></button>
                            <button class="list-action-btn" onclick="handleListAction('{{id}}', 'view')"><i class="fas fa-eye"></i></button>
                            <button class="list-action-btn danger" onclick="handleListAction('{{id}}', 'delete')"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </template>
                <template id="activity-card-template">
                    <div class="list-card">
                        <div class="list-card-icon {{iconClass}}">
                            <i class="fas {{icon}}"></i>
                        </div>
                        <div class="list-card-content">
                            <h4 class="list-card-title">{{title}}</h4>
                            <p class="list-card-desc">{{description}}</p>
                        </div>
                        <span class="text-xs text-gray-400">{{time}}</span>
                    </div>
                </template>
            </div>
            <div id="page-home" class="page-content active"></div>
            <div id="page-home-new" class="page-content"></div>
            <div id="page-communities" class="page-content"></div>
            <div id="page-community-detail" class="page-content"></div>
            <div id="page-create-community" class="page-content"></div>
            <div id="page-community-members" class="page-content"></div>
            <div id="page-community-home" class="page-content"></div>
            <div id="page-community-dashboard" class="page-content"></div>
            <div id="page-events" class="page-content"></div>
            <div id="page-event-detail" class="page-content"></div>
            <div id="page-create-event" class="page-content"></div>
            <div id="page-registrations" class="page-content"></div>
            <div id="page-users" class="page-content"></div>
            <div id="page-categories" class="page-content"></div>
            <div id="page-create-category" class="page-content"></div>
            <div id="page-dashboard" class="page-content"></div>
            <div id="page-applications" class="page-content"></div>
            <div id="page-community-approvals" class="page-content"></div>
            <div id="page-profile" class="page-content"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="components/card-components.js"></script>
    <script src="app.js"></script>
</body>
</html>
